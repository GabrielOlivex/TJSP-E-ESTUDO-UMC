<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prep TJSP & UMC Law - 1000+ Questões & 200 Flashcards</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- CABEÇALHO -->
    <header class="bg-indigo-950 text-white shadow-md border-b border-indigo-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-700 p-2.5 rounded-xl shadow-inner text-amber-400">
                    <i class="fa-solid fa-scale-balanced text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Prep TJSP & UMC Law</h1>
                    <p class="text-xs text-indigo-200">1.000+ Questões • 200 Flashcards de Memorização</p>
                </div>
            </div>

            <!-- PERFIL E ALTERNADOR DE CONTAS -->
            <div id="user-header-info" class="hidden flex flex-wrap items-center gap-3 bg-indigo-900/80 px-4 py-2 rounded-xl border border-indigo-700/50">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-user-shield text-amber-400"></i>
                    <span id="user-display-email" class="text-xs font-semibold"></span>
                </div>
                <div class="flex items-center gap-1">
                    <select id="account-switcher" onchange="switchAccount(this.value)" class="bg-indigo-950 text-white text-xs px-2.5 py-1.5 rounded-lg border border-indigo-600 focus:outline-none">
                    </select>
                    <button onclick="openAddAccountModal()" title="Adicionar / Criar novo login" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-2.5 py-1.5 rounded-lg transition font-medium">
                        <i class="fa-solid fa-user-plus"></i>
                    </button>
                </div>
                <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg transition font-medium shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-right-from-bracket"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">

        <!-- TELA DE AUTENTICAÇÃO -->
        <section id="auth-section" class="max-w-md mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden my-12">
            <div class="bg-gradient-to-r from-indigo-950 to-indigo-800 px-6 py-6 text-white text-center">
                <h2 id="auth-title" class="text-2xl font-bold">Acesse sua Conta</h2>
                <p id="auth-subtitle" class="text-xs text-indigo-200 mt-1">Plataforma de Estudos TJSP & UMC</p>
            </div>
            
            <div class="p-6 space-y-4">
                <div id="auth-error" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-3 text-sm rounded"></div>
                
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">E-mail</label>
                    <input type="email" id="auth-email" placeholder="seuemail@exemplo.com" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">Senha</label>
                    <input type="password" id="auth-password" placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <button onclick="handleAuthSubmit()" id="auth-submit-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-md text-sm">
                    Entrar no Sistema
                </button>

                <div class="text-center pt-2">
                    <button onclick="toggleAuthMode()" id="auth-toggle-btn" class="text-xs text-indigo-600 hover:underline font-medium">
                        Não tem uma conta? Cadastre-se gratuitamente
                    </button>
                </div>
            </div>
        </section>

        <!-- DASHBOARD DE ESTUDOS (PÓS-LOGIN) -->
        <div id="dashboard-section" class="hidden space-y-6">
            
            <!-- ABAS DE NAVEGAÇÃO -->
            <div class="flex overflow-x-auto bg-white p-1.5 rounded-2xl shadow-sm border border-slate-200 gap-1">
                <button onclick="switchTab('questoes')" id="tab-btn-questoes" class="flex-1 py-2.5 px-3 rounded-xl font-semibold text-xs sm:text-sm transition flex items-center justify-center gap-2 bg-indigo-600 text-white shadow-sm">
                    <i class="fa-solid fa-list-check"></i> Banco de 1.000+ Questões
                </button>
                <button onclick="switchTab('flashcards')" id="tab-btn-flashcards" class="flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm transition flex items-center justify-center gap-2 text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-bolt text-amber-500"></i> 200 Flashcards <span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded-full font-bold">200</span>
                </button>
                <button onclick="switchTab('edital')" id="tab-btn-edital" class="flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm transition flex items-center justify-center gap-2 text-slate-600 hover:bg-slate-100">
                    <i class="fa-solid fa-book-open"></i> Edital TJSP & Grade UMC
                </button>
                <button onclick="switchTab('erros')" id="tab-btn-erros" class="
