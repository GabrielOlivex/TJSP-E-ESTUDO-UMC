<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta dos Docinhos - Direito Civil: Contratos e Doações</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at center, #3b175c 0%, #1a082b 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 15px;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
            z-index: 10;
        }

        .header h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.1rem;
            color: #ffd54f;
            text-shadow: 0 4px 0 #5d107a, 0 6px 15px rgba(0, 0, 0, 0.6);
            letter-spacing: 1px;
        }

        .header p {
            font-size: 1rem;
            color: #e1bee7;
            margin-top: 4px;
            font-weight: 600;
        }

        .wheel-stage {
            position: relative;
            width: 430px;
            height: 430px;
            max-width: 92vw;
            max-height: 92vw;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
        }

        /* Aro externo estilo cassino com luzes */
        .casino-rim {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: linear-gradient(145deg, #6a1b9a, #38006b);
            padding: 20px;
            box-shadow: 
                0 0 0 6px #ffca28,
                0 15px 35px rgba(0, 0, 0, 0.8),
                inset 0 0 20px rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bulb {
            position: absolute;
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: #fff9c4;
            box-shadow: 0 0 8px #ffeb3b, 0 0 14px #ff9800;
            top: 50%;
            left: 50%;
            transform-origin: 0 0;
            animation: blink 1.2s infinite alternate;
        }

        .bulb:nth-child(even) {
            animation-delay: 0.6s;
        }

        @keyframes blink {
            0% { opacity: 0.4; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1.15); }
        }

        .canvas-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
            border: 4px solid #ffd54f;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            transition: transform 5s cubic-bezier(0.12, 0.88, 0.18, 1);
        }

        /* Centro da Roleta */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 105px;
            height: 105px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #7b1fa2, #310a47);
            border: 5px solid #ffd54f;
            box-shadow: 0 6px 18px rgba(0,0,0,0.7), inset 0 0 10px rgba(255,213,79,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 15;
            user-select: none;
        }

        .center-hub span {
            font-family: 'Fredoka One', cursive;
            color: #ffd54f;
            font-size: 0.82rem;
            line-height: 1.1;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.8);
        }

        /* Ponteiro Lateral Direito */
        .pointer-right {
            position: absolute;
            right: -14px;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 36px solid #ffffff;
            filter: drop-shadow(-3px 4px 5px rgba(0,0,0,0.7));
            z-index: 25;
        }

        .pointer-right::after {
            content: '';
            position: absolute;
            right: -33px;
            top: -13px;
            border-top: 13px solid transparent;
            border-bottom: 13px solid transparent;
            border-right: 24px solid #ffca28;
        }

        .spin-btn {
            margin-top: 22px;
            background: linear-gradient(180deg, #ffeb3b 0%, #fbc02d 100%);
            color: #38006b;
            font-family: 'Fredoka One', cursive;
            font-size: 1.4rem;
            padding: 14px 45px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 0 #c49000, 0 12px 25px rgba(0,0,0,0.5);
            transition: all 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .spin-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        .spin-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #c49000, 0 5px 10px rgba(0,0,0,0.5);
        }

        .spin-btn:disabled {
            background: #9e9e9e;
            color: #424242;
            box-shadow: 0 4px 0 #616161;
            cursor: not-allowed;
        }

        /* Modal de Resultado */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 5, 25, 0.82);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-box {
            background: linear-gradient(145deg, #ffffff, #f3e5f5);
            color: #2c073d;
            border-radius: 24px;
            padding: 30px 25px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            border: 5px solid #ffca28;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            animation: bounceIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-emoji {
            font-size: 3.5rem;
            margin-bottom: 8px;
        }

        .modal-title {
            font-family: 'Fredoka One', cursive;
            font-size: 1.7rem;
            color: #6a1b9a;
            margin-bottom: 10px;
        }

        .modal-prize {
            background: #ffecb3;
            border: 2px dashed #ff8f00;
            border-radius: 12px;
            padding: 12px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #bf360c;
            margin-bottom: 15px;
        }

        .law-note {
            font-size: 0.88rem;
            color: #4a148c;
            background: rgba(106, 27, 154, 0.08);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.35;
        }

        .close-btn {
            background: #6a1b9a;
            color: #fff;
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            padding: 10px 30px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #38006b;
        }

        .close-btn:hover {
            background: #7b1fa2;
        }

        /* Emojis voadores */
        .floating-candy {
            position: fixed;
            font-size: 2.2rem;
            pointer-events: none;
            z-index: 90;
            animation: flyUp 2.2s ease-out forwards;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-450px) scale(1.4) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>⚖️ Roleta dos Docinhos</h1>
        <p>Direito Civil • Contratos e Doações (Art. 538 CC)</p>
    </div>

    <div class="wheel-stage">
        <div class="casino-rim" id="casinoRim">
            <div class="canvas-wrapper">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
            </div>
            <div class="center-hub">
                <span>🎁<br>Roleta<br>dos<br>Docinhos</span>
            </div>
        </div>
        <div class="pointer-right"></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="iniciarGiro()">GIRAR ROLETA</button>

    <!-- Modal de Resultado -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-emoji" id="modalEmoji">🍬</div>
            <div class="modal-title">Doação Concluída!</div>
            <div class="modal-prize" id="modalPrize">Prêmio</div>
            <div class="law-note">
                <strong>Art. 538 do Código Civil:</strong> Considera-se doação o contrato em que uma pessoa, por liberalidade, transfere do seu patrimônio bens ou vantagens para o de outra.
            </div>
            <button class="close-btn" onclick="fecharModal()">Receber Prêmio</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const rim = document.getElementById('casinoRim');

        // Criar luzes no aro
        const totalBulbs = 24;
        for (let i = 0; i < totalBulbs; i++) {
            const bulb = document.createElement('div');
            bulb.className = 'bulb';
            const angle = (i * 360) / totalBulbs;
            bulb.style.transform = `rotate(${angle}deg) translate(203px) rotate(-${angle}deg)`;
            rim.appendChild(bulb);
        }

        // Configuração das 8 fatias e suas probabilidades (Soma = 100)
        const fatias = [
            {
                titulo: "Ouro Branco",
                subtitulo: "1 bombom",
                corFundo: "#ffe082",
                corBorda: "#ffb300",
                corTexto: "#4e342e",
                emoji: "🍫",
                emojisConfete: ["🍫", "✨", "💛"],
                chance: 10 // 10% de chance
            },
            {
                titulo: "Lua Cheia",
                subtitulo: "1 bala",
                corFundo: "#f8bbd0",
                corBorda: "#ec407a",
                corTexto: "#880e4f",
                emoji: "🍬",
                emojisConfete: ["🍬", "💙", "💖"],
                chance: 16 // 16% de chance
            },
            {
                titulo: "Pirulito",
                subtitulo: "1 unidade",
                corFundo: "#e1bee7",
                corBorda: "#8e24aa",
                corTexto: "#4a148c",
                emoji: "🍭",
                emojisConfete: ["🍭", "🌈", "💜"],
                chance: 16 // 16% de chance
            },
            {
                titulo: "Prêmio Premium",
                subtitulo: "3 doces à escolha",
                corFundo: "#d1c4e9",
                corBorda: "#5e35b1",
                corTexto: "#311b92",
                emoji: "👑",
                emojisConfete: ["👑", "🍬", "🍭", "🍫"],
                chance: 5 // 5% de chance (Reduzido!)
            },
            {
                titulo: "Super Premium",
                subtitulo: "5 docinhos + beijinho",
                corFundo: "#ce93d8",
                corBorda: "#6a1b9a",
                corTexto: "#ffffff",
                emoji: "🎁",
                emojisConfete: ["🎁", "🧁", "🍫", "⭐"],
                chance: 5 // 5% de chance
            },
            {
                titulo: "Combo Docinho",
                subtitulo: "1 bala + 1 pirulito",
                corFundo: "#ffcc80",
                corBorda: "#fb8c00",
                corTexto: "#e65100",
                emoji: "🍭",
                emojisConfete: ["🍭", "🍬", "🍫"],
                chance: 16 // 16% de chance
            },
            {
                titulo: "Dia de Azar",
                subtitulo: "Só 1 bala. Sem choro!",
                corFundo: "#cfd8dc",
                corBorda: "#607d8b",
                corTexto: "#263238",
                emoji: "😜",
                emojisConfete: ["🍬", "😜", "💧"],
                chance: 16 // 16% de chance
            },
            {
                titulo: "Sorte em Dobro",
                subtitulo: "2 doces surpresa",
                corFundo: "#f48fb1",
                corBorda: "#ad1457",
                corTexto: "#4a0072",
                emoji: "🎉",
                emojisConfete: ["🍬", "🍭", "🎉", "💜"],
                chance: 16 // 16% de chance
            }
        ];

        const numFatias = fatias.length;
        const arcAngle = (2 * Math.PI) / numFatias;
        let rotacaoAtual = 0;
        let girando = false;

        // Desenhar Roleta no Canvas
        function desenharRoleta() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const raio = cx;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            fatias.forEach((fatia, i) => {
                const startAngle = i * arcAngle;
                const endAngle = startAngle + arcAngle;

                // Fundo da fatia
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, raio, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = fatia.corFundo;
                ctx.fill();

                // Borda divisória
                ctx.lineWidth = 4;
                ctx.strokeStyle = fatia.corBorda;
                ctx.stroke();

                // Conteúdo da fatia
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(startAngle + arcAngle / 2);

                // Emoji ilustrativo próximo à borda externa
                ctx.font = "46px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(fatia.emoji, raio - 55, 0);

                // Título do Prêmio
                ctx.fillStyle = fatia.corTexto;
                ctx.font = "bold 20px 'Fredoka One', sans-serif";
                ctx.textAlign = "right";
                ctx.fillText(fatia.titulo, raio - 92, -10);

                // Subtítulo do Prêmio
                ctx.font = "800 14px 'Nunito', sans-serif";
                ctx.fillText(fatia.subtitulo, raio - 92, 12);

                ctx.restore();
            });
        }

        desenharRoleta();

        // Sorteio Ponderado baseado na porcentagem definida em cada fatia
        function sortearIndicePonderado() {
            const somaPesos = fatias.reduce((acc, item) => acc + item.chance, 0);
            let sorteio = Math.random() * somaPesos;

            for (let i = 0; i < fatias.length; i++) {
                if (sorteio < fatias[i].chance) {
                    return i;
                }
                sorteio -= fatias[i].chance;
            }
            return 0;
        }

        // Sintetizador de Som (Tambores de Suspense + Vitória) via Web Audio API
        let audioCtx = null;
        let drumInterval = null;

        function iniciarTambores(duracaoMs) {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const inicio = Date.now();
            let intervaloAtual = 140;

            function baterTambor() {
                const decorrido = Date.now() - inicio;
                if (decorrido >= duracaoMs - 200) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(140, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(55, audioCtx.currentTime + 0.08);

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.09);

                // Acelera no meio e desacelera no final
                const progresso = decorrido / duracaoMs;
                if (progresso < 0.5) {
                    intervaloAtual = Math.max(55, 140 - progresso * 170);
                } else {
                    intervaloAtual = 55 + (progresso - 0.5) * 260;
                }

                drumInterval = setTimeout(baterTambor, intervaloAtual);
            }

            baterTambor();
        }

        function tocarSomVitoria() {
            if (!audioCtx) return;
            const notas = [523.25, 659.25, 783.99, 1046.50]; // Acorde Dó Maior
            notas.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);

                gain.gain.setValueAtTime(0.2, audioCtx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.6);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.08);
                osc.stop(audioCtx.currentTime + idx * 0.08 + 0.6);
            });
        }

        function iniciarGiro() {
            if (girando) return;
            girando = true;
            document.getElementById('spinBtn').disabled = true;

            const indiceVencedor = sortearIndicePonderado();
            const grausPorFatia = 360 / numFatias;

            // O ponteiro está à direita (0 graus no Canvas).
            // Calculamos o ângulo central da fatia sorteada e alinhamos a 0 graus.
            const anguloCentroFatia = indiceVencedor * grausPorFatia + grausPorFatia / 2;
            const voltasCompletas = 6 * 360;
            const ajusteAtual = rotacaoAtual % 360;
            const anguloAlvo = voltasCompletas + (360 - anguloCentroFatia) - ajusteAtual;

            rotacaoAtual += anguloAlvo;
            canvas.style.transform = `rotate(${rotacaoAtual}deg)`;

            const tempoGiro = 5000;
            iniciarTambores(tempoGiro);

            setTimeout(() => {
                clearTimeout(drumInterval);
                tocarSomVitoria();
                dispararFesta(fatias[indiceVencedor]);
                mostrarModal(fatias[indiceVencedor]);
                girando = false;
                document.getElementById('spinBtn').disabled = false;
            }, tempoGiro);
        }

        function dispararFesta(premio) {
            // Explosão de confetes tradicionais
            confetti({
                particleCount: 100,
                spread: 80,
                origin: { y: 0.6 }
            });

            // Chuva de emojis específicos do prêmio sorteado
            for (let i = 0; i < 18; i++) {
                const span = document.createElement('span');
                span.className = 'floating-candy';
                const lista = premio.emojisConfete;
                span.innerText = lista[Math.floor(Math.random() * lista.length)];
                span.style.left = Math.random() * 90 + 5 + 'vw';
                span.style.bottom = '10px';
                span.style.animationDelay = (Math.random() * 0.5) + 's';
                document.body.appendChild(span);

                setTimeout(() => span.remove(), 2600);
            }
        }

        function mostrarModal(premio) {
            document.getElementById('modalEmoji').innerText = premio.emoji;
            document.getElementById('modalPrize').innerText = `${premio.titulo} — ${premio.subtitulo}`;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function fecharModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    </script>
</body>
</html>
